{% extends 'rooms_main.html' %}

{% block content %}
<section class="form-card">
  <h1 class="panel-title">Update room</h1>
  <p class="panel-subtitle">Edit the room details.</p>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a href="{% url 'rooms_home' %}" class="btn btn-secondary">Cancel</a>
  </form>
</section>
{% endblock content %}
