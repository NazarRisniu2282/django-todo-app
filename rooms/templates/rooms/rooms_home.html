{% extends 'rooms_main.html' %}

{% block content %}
<div class="panel">
  <div class="panel-header">
    <div>
      <h1 class="panel-title">Rooms</h1>
      <p class="panel-subtitle">Manage your rooms and create new collaborative spaces.</p>
    </div>
    <div class="panel-actions">
      <form action="{% url 'create_room' %}" method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Create room</button>
      </form>
    </div>
  </div>

  <div class="rooms-grid">
    {% for room in rooms %}
    <article class="room-card">
      <div>
        <a href="{% url 'room' room.id %}"><h2>{{ room.name }}</h2></a>
        <p>{{ room.description }}</p>
      </div>
      <div class="room-actions">
        <a href="{% url 'room' room.id %}" class="btn btn-secondary">Open</a>
        <a href="{% url 'delete_room' room.id %}" class="btn btn-outline">Delete</a>
      </div>
    </article>
    {% endfor %}
  </div>
</div>
{% endblock content %}
